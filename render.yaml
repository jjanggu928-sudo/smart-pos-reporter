# render.yaml
# Smart POS Insight Reporter 배포를 위한 Render 설정 파일

services:
  - type: web
    name: smart-pos-insight-reporter
    env: python
    plan: free # 또는 필요에 따라 "starter" 등의 다른 플랜으로 변경
    region: singapore # 또는 가까운 다른 리전 선택 (e.g., oregon)
    
    # 빌드 및 시작 명령어 설정
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run src/main.py --server.port $PORT --server.address 0.0.0.0"

    # 환경 변수 설정
    # 아래의 SUPABASE_URL과 SUPABASE_ANON_KEY는 Render 대시보드의
    # 'Environment' 탭에서 'Secret File' 또는 'Environment Variable'로 직접 설정해야 합니다.
    # .env 파일의 내용을 복사하여 붙여넣으세요.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11" # Dockerfile과 일치시킴
      - key: SUPABASE_URL
        value: "YOUR_SUPABASE_URL_HERE" # .env 파일의 값으로 교체
      - key: SUPABASE_ANON_KEY
        value: "YOUR_SUPABASE_ANON_KEY_HERE" # .env 파일의 값으로 교체